<!DOCTYPE html>
<html lang="en" class="h-full bg-[#f7f5f1] text-[#1d1b19] antialiased">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tuition Centre Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Public+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            paper: '#f7f5f1',
            ink: '#1d1b19',
            line: '#e4dfd6',
            brand: {
              DEFAULT: '#24473f',
              dark: '#1b352f',
              soft: '#e8efe9',
            }
          },
          fontFamily: {
            display: ['Newsreader', 'Georgia', 'serif'],
            body: ['"Public Sans"', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
          }
        }
      }
    };
  </script>
  <style>
    body {
      font-family: 'Public Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #f7f5f1;
      color: #1d1b19;
      font-feature-settings: "cv02", "cv03", "cv04", "cv11";
      -webkit-font-smoothing: antialiased;
    }

    .font-display {
      font-family: 'Newsreader', Georgia, serif;
    }

    .tabular-nums {
      font-variant-numeric: tabular-nums;
    }

    /* Core Component Classes */
    .card {
      background: #ffffff;
      border: 1px solid #e4dfd6;
      border-radius: 6px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.5rem 0.875rem;
      font-size: 0.875rem;
      font-weight: 500;
      line-height: 1.25rem;
      border-radius: 6px;
      border: 1px solid #e4dfd6;
      background-color: #ffffff;
      color: #1d1b19;
      cursor: pointer;
      transition: background-color 150ms ease, border-color 150ms ease, opacity 150ms ease;
      user-select: none;
      white-space: nowrap;
    }

    .btn:hover:not(:disabled) {
      background-color: #f7f5f1;
    }

    .btn:focus-visible {
      outline: 2px solid #24473f;
      outline-offset: 1px;
    }

    .btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .btn-primary {
      background-color: #24473f;
      color: #ffffff;
      border-color: #24473f;
    }

    .btn-primary:hover:not(:disabled) {
      background-color: #1b352f;
      border-color: #1b352f;
    }

    .btn-ghost {
      background-color: transparent;
      border-color: transparent;
      color: #1d1b19;
    }

    .btn-ghost:hover:not(:disabled) {
      background-color: #e8efe9;
    }

    .btn-danger {
      background-color: #ffffff;
      border-color: #ef4444;
      color: #dc2626;
    }

    .btn-danger:hover:not(:disabled) {
      background-color: #fef2f2;
    }

    .btn-sm {
      padding: 0.25rem 0.5rem;
      font-size: 0.75rem;
      line-height: 1rem;
      border-radius: 4px;
    }

    .input {
      display: block;
      width: 100%;
      padding: 0.5rem 0.75rem;
      font-size: 0.875rem;
      line-height: 1.25rem;
      border-radius: 6px;
      border: 1px solid #e4dfd6;
      background-color: #ffffff;
      color: #1d1b19;
      transition: border-color 150ms ease, box-shadow 150ms ease;
    }

    .input:focus {
      outline: none;
      border-color: #24473f;
      box-shadow: 0 0 0 1px #24473f;
    }

    .input:disabled {
      background-color: #f7f5f1;
      opacity: 0.75;
      cursor: not-allowed;
    }

    .label {
      display: block;
      font-size: 0.8125rem;
      font-weight: 500;
      color: #55514b;
      margin-bottom: 0.25rem;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 0.125rem 0.5rem;
      font-size: 0.75rem;
      font-weight: 500;
      border-radius: 4px;
      line-height: 1rem;
      white-space: nowrap;
      border: 1px solid transparent;
    }

    .badge-neutral {
      background-color: #f0ece1;
      color: #4b463e;
      border-color: #e4dfd6;
    }

    .badge-success {
      background-color: #e8efe9;
      color: #166534;
      border-color: #bbf7d0;
    }

    .badge-warning {
      background-color: #fef3c7;
      color: #92400e;
      border-color: #fde68a;
    }

    .badge-danger {
      background-color: #fee2e2;
      color: #991b1b;
      border-color: #fecaca;
    }

    .tbl {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.875rem;
      text-align: left;
    }

    .tbl th {
      background-color: #f7f5f1;
      color: #55514b;
      font-weight: 500;
      padding: 0.625rem 0.875rem;
      border-bottom: 1px solid #e4dfd6;
      font-size: 0.75rem;
      letter-spacing: 0.02em;
    }

    .tbl td {
      padding: 0.75rem 0.875rem;
      border-bottom: 1px solid #e4dfd6;
      color: #1d1b19;
      vertical-align: middle;
    }

    .tbl tr:last-child td {
      border-bottom: none;
    }

    .tbl tbody tr:hover {
      background-color: #faf8f5;
    }

    /* Print Styles */
    @media print {
      body {
        background-color: #ffffff !important;
        color: #000000 !important;
      }

      .no-print {
        display: none !important;
      }

      .print-only {
        display: block !important;
      }

      .card {
        border: 1px solid #000000 !important;
        box-shadow: none !important;
      }
    }

    @media screen {
      .print-only {
        display: none !important;
      }
    }
  </style>
</head>

<body class="h-full min-h-screen flex flex-col">

  <div id="toast" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 max-w-sm w-full pointer-events-none"></div>

  <script id="app-env">

  <script src="js/core.js?v=3.7"></script>
  <script src="js/shared.js?v=3.7"></script>
  <script src="js/principal.js?v=3.7"></script>
  <script src="js/teacher.js?v=3.7"></script>
  <script src="js/student.js?v=3.7"></script>

</body>

</html>
